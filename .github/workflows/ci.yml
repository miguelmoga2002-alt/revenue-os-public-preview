name: Public Preview CI — SQLite PostgreSQL Browser
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
# A feature branch with an open PR is validated via pull_request only.
# Avoid running the same suite twice for every commit.
concurrency:
  group: revenue-os-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fail fast on Python syntax errors
        run: python -m compileall -q app tests scripts alembic bootstrap.py
  security:
    needs: syntax
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check tracked files for private environment and key material
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.env($|\.[^/]+$)|(^|/)secrets/|\.(pem|key)$' | grep -vE '(^|/)\.env\.example$'; then
            echo 'Tracked private environment files or key material detected' >&2
            exit 1
          fi
      - name: Install security scanners
        run: python -m pip install -r requirements.txt 'pip-audit>=2,<4' 'bandit>=1.7,<2'
      - name: Audit dependency vulnerabilities
        run: python -m pip_audit -r requirements.txt
      - name: Fail on high-severity Python static findings
        run: bandit -r app -q -lll

  sqlite:
    needs: syntax
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse browser JavaScript in all three HTML screens
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          for file in ("web/index.html", "web/focus.html", "web/crm.html"):
              content = Path(file).read_text(encoding="utf-8")
              script = re.search(r"<script[^>]*>(.*?)</script>", content, re.S | re.I)
              assert script, file + " has no script"
              with tempfile.NamedTemporaryFile(mode="w", encoding="utf-8", suffix=".js", delete=False) as tmp:
                  tmp.write(script.group(1))
                  pathname = tmp.name
              try:
                  subprocess.run(["node", "--check", pathname], check=True)
              finally:
                  Path(pathname).unlink(missing_ok=True)
          print("JavaScript parsed in all screens")
          PY
      - run: python -m pytest -q tests
      - name: SQLite migration roundtrip
        env:
          REVENUE_OS_DATABASE_URL: sqlite:///./ci_migration.db
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check
  postgres:
    needs: syntax
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: revenue
          POSTGRES_PASSWORD: ci-test-password-not-for-production
          POSTGRES_DB: revenue_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U revenue -d revenue_os_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      REVENUE_OS_DATABASE_URL: postgresql+psycopg://revenue:ci-test-password-not-for-production@localhost:5432/revenue_os_test
      REVENUE_OS_TEST_POSTGRES_URL: postgresql+psycopg://revenue:ci-test-password-not-for-production@localhost:5432/revenue_os_test
      REVENUE_OS_TEST_APP_PASSWORD: ci-app-password-for-tests-only
      REVENUE_OS_REQUIRE_ADMIN_MFA: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: PostgreSQL migration and drift check
        run: |
          alembic upgrade head
          alembic check
      - name: Provision real restricted app login (not the database owner)
        env:
          REVENUE_OS_APP_DB_PASSWORD: ci-app-password-for-tests-only
        run: python scripts/provision_app_role.py
      - name: Verify restricted app login
        env:
          REVENUE_OS_DATABASE_URL: postgresql+psycopg://revenue_app:ci-app-password-for-tests-only@localhost:5432/revenue_os_test
        run: |
          python -c "from app.db import engine; from sqlalchemy import text; c=engine.connect(); assert c.scalar(text('SELECT current_user')) == 'revenue_app'; assert not c.scalar(text('SELECT rolbypassrls FROM pg_roles WHERE rolname=current_user')); c.close()"
      - name: PostgreSQL authenticated API and direct SQL RLS checks
        run: python -m pytest -q tests/test_postgres_integration.py tests/test_postgres_rls.py tests/test_postgres_work_concurrency.py tests/test_postgres_crm_links.py tests/test_postgres_record_acl.py tests/test_postgres_pipeline_concurrency.py tests/test_postgres_task_reconcile_concurrency.py tests/test_postgres_identity_security.py tests/test_postgres_commercial_signals.py tests/test_postgres_pipedrive_sync.py tests/test_postgres_crm_oauth.py
      - name: PostgreSQL migration roundtrip
        run: |
          alembic downgrade base
          alembic upgrade head
          alembic check

  compose:
    needs: syntax
    name: Docker Compose isolated full-stack smoke
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Start isolated Compose and verify restricted API DB role
        shell: bash
        run: |
          set -euo pipefail
          project="revenueosci${{ github.run_id }}"
          envfile="$RUNNER_TEMP/revenueos-compose-test.env"
          printf 'POSTGRES_PASSWORD=%s\nPOSTGRES_APP_PASSWORD=%s\n' \
            'ci-owner-pass-only-for-isolated-gh-2026' \
            'ci-app-pass-only-for-isolated-gh-2026' > "$envfile"
          chmod 600 "$envfile"
          compose() { docker compose -p "$project" --env-file "$envfile" "$@"; }
          cleanup() {
            rc=$?
            if [ "$rc" -ne 0 ]; then compose ps || true; compose logs --no-color --tail=50 || true; fi
            compose down --volumes --remove-orphans || true
            exit "$rc"
          }
          trap cleanup EXIT
          compose config --quiet
          compose up -d --build app
          # Docker has started the container but Uvicorn may not be listening yet.
          # Curl's default retry policy does NOT retry every connection reset.
          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 3 http://127.0.0.1:8000/health >/dev/null 2>&1; then
              ready=1; break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then echo "API readiness failed" >&2; exit 1; fi
          compose exec -T app python -c "from app.db import engine; from sqlalchemy import text; c=engine.connect(); assert c.scalar(text('select current_user'))=='revenue_app'; assert c.scalar(text('select version_num from alembic_version'))=='012_deal_notes'; assert c.scalar(text(\"select relrowsecurity from pg_class where relname='record_grants'\")); c.close(); print('COMPOSE PASS: runtime role, Alembic and RLS')"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v1/records)
          [ "$code" = "401" ]

  browser:
    needs: syntax
    name: Chromium E2E — sales journey
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install real Chromium, Playwright and axe accessibility engine
        run: |
          python -m pip install 'pytest>=8,<10' 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
          npm install --prefix e2e --no-save --package-lock=false axe-core@4.10.3
      - name: Run browser flow on isolated PostgreSQL and verify SQL audit trail
        shell: bash
        env:
          REVENUE_OS_E2E_URL: http://127.0.0.1:8000
        run: |
          set -euo pipefail
          project="revenueosbrowser${{ github.run_id }}"
          envfile="$RUNNER_TEMP/revenueos-e2e-test.env"
          printf 'POSTGRES_PASSWORD=%s\nPOSTGRES_APP_PASSWORD=%s\n' \
            'ci-e2e-owner-only-gh-actions-2026' \
            'ci-e2e-runtime-only-gh-actions-2026' > "$envfile"
          echo 'REVENUE_OS_REQUIRE_ADMIN_MFA=0' >> "$envfile"
          chmod 600 "$envfile"
          compose() { docker compose -p "$project" --env-file "$envfile" "$@"; }
          cleanup() {
            rc=$?
            if [ "$rc" -ne 0 ]; then compose ps || true; compose logs --no-color --tail=70 || true; fi
            compose down --volumes --remove-orphans || true
            exit "$rc"
          }
          trap cleanup EXIT
          compose config --quiet
          compose up -d --build app
          ready=0
          for attempt in $(seq 1 40); do
            if curl -fsS --max-time 3 "$REVENUE_OS_E2E_URL/health" >/dev/null 2>&1; then
              ready=1; break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then echo "API readiness failed" >&2; exit 1; fi
          compose exec -T -e GITHUB_ACTIONS=true -e REVENUE_OS_E2E_SEED=synthetic-ci-only app python -m scripts.seed_browser_ci
          python -m pytest -q e2e/test_sales_journey.py
          compose exec -T -e GITHUB_ACTIONS=true -e REVENUE_OS_E2E_SEED=synthetic-ci-only app python -m scripts.verify_browser_ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-e2e-evidence
          path: artifacts/browser/
          if-no-files-found: ignore
          retention-days: 3

  windows-syntax:
    needs: syntax
    name: Windows PowerShell syntax (no credentials)
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Parse safe interactive QA script without executing login
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.\scripts\verify-v11-session-logout-windows.ps1').Path,
            [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          Write-Host 'PASS: Windows PowerShell script syntax'
